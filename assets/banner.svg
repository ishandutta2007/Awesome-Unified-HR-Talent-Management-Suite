<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 240"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="scanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="hubGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width=".5" d="M 30 0 L 0 0 0 30"/><circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity=".2"/></pattern><style>@keyframes pulseGlow{0%{filter:drop-shadow(0 0 10px rgba(56,189,248,.6));opacity:.9}50%{filter:drop-shadow(0 0 22px rgba(168,85,247,.85));opacity:1}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes scanLine{0%{transform:translateY(0);opacity:.2}50%{opacity:.8}}@keyframes circuitDash{0%{stroke-dashoffset:200}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-6px)}