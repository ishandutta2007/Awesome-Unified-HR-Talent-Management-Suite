ity=".14"/><line x1="120" x2="205" y1="120" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity=".6"/></g><g class="pulse-hub" transform="translate(92, 92)"><circle cx="28" cy="28" r="26" fill="url(#accentGrad)" filter="url(#hubGlow)" opacity=".95"/><circle cx="28" cy="28" r="22" fill="#090d16" opacity=".8"/><circle cx="28" cy="20" r="6" fill="#38bdf8"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="2.2" d="M 17 38 C 17 31.5 22 28.5 28 28.5 C 34 28.5 39 31.5 39 38"/></g></g><g><g class="floating-node-1" transform="translate(255, 0) translate(0, 32)"><rect width="235" height="24" x="0" y="0" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity=".85" rx="12"/><circle cx="12" cy="12" r="4" fill="#22c55e"/><text x="24" y="16" fill="#a5b4fc" class="sub-text" font-size="11" letter-spacing="1">CURATED TALENT &amp; HCM STACK</text></g><text x="0" y="98" fill="url(#textGrad)" class="title-text" font-size="29" letter-spacing=".5" transform="translate(255, 0)">Awesome HR &amp; Talent Suite</text><text x="0" y="132" fill="#f1f5f9" class="sub-text" font-size="14.5" transform="translate(255, 0)">Unified Human Capital Management (HCM), Core HRMS &amp; Talent Platforms</text><g transform="translate(255, 0) translate(0, 162)"><rect width="135" height="26" x="0" y="0" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="6"/><text x="67" y="17" fill="#bae6fd" class="sub-text" font-size="11" text-anchor="middle">🏢 Enterprise SaaS</text><rect width="150" height="26" x="145" y="0" fill="#0f172a" stroke="#818cf8" stroke-opacity=".5" stroke-width="1" rx="6"/><text x="220" y="17" fill="#c7d2fe" class="sub-text" font-size="11" text-anchor="middle">🔓 Open-Source HRMS</text><rect width="135" height="26" x="305" y="0" fill="#0f172a" stroke="#c084fc" stroke-opacity=".5" stroke-width="1" rx="6"/><text x="372" y="17" fill="#e9d5ff" class="sub-text" font-size="11" text-anchor="middle">💰 Payroll &amp; Comp</text><rect width="145" height="26" x="450" 