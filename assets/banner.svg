<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badge-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badge-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="badge-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    /* Continuous background pulse & floating animations */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.12) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes pulseGlow2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.55; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes streamDash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
    }

    .glow-1 { animation: pulseGlow 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .glow-2 { animation: pulseGlow2 11s ease-in-out infinite; transform-origin: 1000px 250px; }
    .stream-line { stroke-dasharray: 8, 12; animation: streamDash 6s linear infinite; }
    .stream-line-fast { stroke-dasharray: 6, 10; animation: streamDash 3.5s linear infinite; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .pill-card { backdrop-filter: blur(8px); transition: all 0.3s ease; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background (Never hides foreground text) -->
  <g class="glow-1">
    <circle cx="220" cy="110" r="140" fill="url(#glow-grad)" filter="blur(40px)"/>
  </g>
  <g class="glow-2">
    <circle cx="1020" cy="240" r="160" fill="url(#glow-grad)" filter="blur(50px)"/>
  </g>

  <!-- Background Flow Lines & Connected Talent Graph Elements -->
  <g opacity="0.45">
    <path class="stream-line" d="M 50 180 Q 250 80 500 160 T 950 120 T 1180 200" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path class="stream-line-fast" d="M 20 280 Q 300 350 600 270 T 1150 290" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="150" cy="80" r="3.5" fill="#38bdf8"/>
  <circle class="particle-2" cx="1080" cy="90" r="4" fill="#c084fc"/>
  <circle class="particle-3" cx="90" cy="300" r="3" fill="#34d399"/>
  <circle class="particle-1" cx="1120" cy="310" r="3.5" fill="#f43f5e"/>
  <circle class="particle-2" cx="620" cy="40" r="2.5" fill="#38bdf8"/>

  <!-- Left Side Graphic: HR & Employee Lifecycle Nodes Flow (Behind or strictly aligned) -->
  <g transform="translate(60, 60)" opacity="0.85">
    <!-- Talent Node 1: Sourcing/Recruit -->
    <circle cx="40" cy="40" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="40" y="44" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">ATS</text>
    <line x1="60" y1="40" x2="100" y2="70" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Talent Node 2: Core HRMS -->
    <circle cx="120" cy="85" r="26" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
    <text x="120" y="90" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">HRMS</text>
    <line x1="120" y1="111" x2="100" y2="155" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Talent Node 3: Payroll / Comp -->
    <circle cx="85" cy="175" r="20" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="85" y="179" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">PAY</text>
  </g>

  <!-- Right Side Graphic: Talent Management & Analytics Flow -->
  <g transform="translate(1000, 60)" opacity="0.85">
    <!-- Performance Node -->
    <circle cx="80" cy="40" r="22" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="80" y="44" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">GOALS</text>
    <line x1="70" y1="60" x2="40" y2="100" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Learning Node -->
    <circle cx="30" cy="120" r="24" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="30" y="124" fill="#fb7185" font-size="11" font-weight="bold" text-anchor="middle">L&amp;D</text>
    <line x1="45" y1="140" x2="80" y2="175" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Analytics Node -->
    <circle cx="90" cy="185" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="189" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">EX</text>
  </g>

  <!-- Center Foreground Content (Crisp, High-Contrast, Guaranteed Visible) -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="-170" y="-35" width="340" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-15" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1.5">⚡ THE CURATED DIRECTORY ⚡</text>

    <!-- Main Title -->
    <text x="0" y="45" fill="url(#text-grad)" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome HR &amp; Talent Suite
    </text>

    <!-- Subtitle -->
    <text x="0" y="85" fill="#94a3b8" font-size="16" font-weight="400">
      Unified Human Capital Management (HCM), Core HRMS &amp; Modern Talent Platforms
    </text>

    <!-- Dynamic Metric Pills in Foreground -->
    <g transform="translate(0, 125)">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="150" height="36" rx="18" fill="url(#badge-grad1)" stroke="#0284c7" stroke-width="1.2" class="pill-card"/>
        <text x="75" y="22" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">🏢 Enterprise SaaS</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(-75, 0)">
        <rect x="0" y="0" width="150" height="36" rx="18" fill="url(#badge-grad2)" stroke="#7c3aed" stroke-width="1.2" class="pill-card"/>
        <text x="75" y="22" fill="#ede9fe" font-size="13" font-weight="600" text-anchor="middle">🔓 Open-Source</text>
      </g>

      <!-- Pill 3: Full Lifecycle -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#badge-grad3)" stroke="#059669" stroke-width="1.2" class="pill-card"/>
        <text x="80" y="22" fill="#d1fae5" font-size="13" font-weight="600" text-anchor="middle">🔄 Hire-to-Retire</text>
      </g>
    </g>
  </g>
</svg>
