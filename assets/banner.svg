<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Theme Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.85)); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(240px); opacity: 0.2; }
      }
      @keyframes circuitDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beaconRing {
        0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 50px; opacity: 0; stroke-width: 0.5px; }
      }
      .pulse-hub { animation: pulseGlow 4s infinite ease-in-out; }
      .scanner { animation: scanLine 5s infinite linear; }
      .circuit-line { stroke-dasharray: 10, 10; animation: circuitDash 8s infinite linear; }
      .radar-sweep { transform-origin: 120px 120px; animation: radarSweep 8s infinite linear; }
      .floating-node-1 { animation: floatNode 3.5s infinite ease-in-out; }
      .floating-node-2 { animation: floatNode 4.5s infinite ease-in-out 1s; }
      .beacon { animation: beaconRing 2.6s infinite cubic-bezier(0.2, 0.8, 0.4, 1); }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" fill="url(#bgGrad)" rx="16"/>
  <rect width="900" height="240" fill="url(#cyberGrid)" rx="16"/>

  <!-- Scanning Line -->
  <rect class="scanner" x="0" y="0" width="900" height="2" fill="url(#scanGrad)" opacity="0.6"/>

  <!-- Circuit Network Lines -->
  <path class="circuit-line" d="M 120 120 L 220 120 L 250 78 L 350 78" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 120 120 L 200 170 L 320 170" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 850 50 L 780 50 L 750 90 L 680 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <path class="circuit-line" d="M 880 190 L 800 190 L 770 150 L 700 150" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Left Radar & HR Lifecycle Hub -->
  <g transform="translate(15, 0)">
    <!-- Radar concentric circles -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="120" cy="120" r="35" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Radar Beacon Wave -->
    <circle class="beacon" cx="120" cy="120" r="10" fill="none" stroke="#38bdf8"/>

    <!-- Radar Rotating Beam -->
    <g class="radar-sweep">
      <path d="M 120 120 L 205 120 A 85 85 0 0 0 120 35 Z" fill="url(#accentGrad)" opacity="0.14"/>
      <line x1="120" y1="120" x2="205" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Center Interactive People / Talent Hub Icon -->
    <g class="pulse-hub" transform="translate(92, 92)">
      <!-- Central Hub Circle -->
      <circle cx="28" cy="28" r="26" fill="url(#accentGrad)" filter="url(#hubGlow)" opacity="0.95"/>
      <circle cx="28" cy="28" r="22" fill="#090d16" opacity="0.8"/>
      
      <!-- User / People Vector Symbol -->
      <circle cx="28" cy="20" r="6" fill="#38bdf8"/>
      <path d="M 17 38 C 17 31.5 22 28.5 28 28.5 C 34 28.5 39 31.5 39 38" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Central Title & Descriptions -->
  <g transform="translate(255, 0)">
    <!-- Top Pill Tag -->
    <g class="floating-node-1" transform="translate(0, 32)">
      <rect x="0" y="0" width="235" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.85"/>
      <circle cx="12" cy="12" r="4" fill="#22c55e"/>
      <text x="24" y="16" fill="#a5b4fc" font-size="11" class="sub-text" letter-spacing="1">CURATED TALENT &amp; HCM STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" fill="url(#textGrad)" font-size="29" class="title-text" letter-spacing="0.5">
      Awesome HR &amp; Talent Suite
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#f1f5f9" font-size="14.5" class="sub-text">
      Unified Human Capital Management (HCM), Core HRMS &amp; Talent Platforms
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 162)">
      <!-- Pill 1: Enterprise SaaS -->
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="67" y="17" fill="#bae6fd" font-size="11" text-anchor="middle" class="sub-text">🏢 Enterprise SaaS</text>

      <!-- Pill 2: Open Source HRMS -->
      <rect x="145" y="0" width="150" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="220" y="17" fill="#c7d2fe" font-size="11" text-anchor="middle" class="sub-text">🔓 Open-Source HRMS</text>

      <!-- Pill 3: Payroll & Comp -->
      <rect x="305" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="372" y="17" fill="#e9d5ff" font-size="11" text-anchor="middle" class="sub-text">💰 Payroll &amp; Comp</text>

      <!-- Pill 4: Hire-to-Retire -->
      <rect x="450" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="522" y="17" fill="#a7f3d0" font-size="11" text-anchor="middle" class="sub-text">🔄 Hire-to-Retire</text>
    </g>
  </g>

  <!-- Right Decorative Floating Nodes -->
  <g class="floating-node-2" transform="translate(760, 45)">
    <!-- Node 1: Recruitment ATS -->
    <circle cx="60" cy="40" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <text x="60" y="45" font-size="15" text-anchor="middle">👥</text>
    
    <!-- Node 2: Performance Goals -->
    <circle cx="20" cy="110" r="15" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="115" font-size="13" text-anchor="middle">🎯</text>
    
    <!-- Node 3: Learning & Growth -->
    <circle cx="85" cy="120" r="14" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <text x="85" y="125" font-size="12" text-anchor="middle">⚡</text>

    <!-- Node Connector Lines -->
    <line x1="60" y1="40" x2="20" y2="110" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="60" y1="40" x2="85" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Outer Border Gradient Stroke -->
  <rect x="1" y="1" width="898" height="238" fill="none" stroke="url(#textGrad)" stroke-width="1.5" rx="15" opacity="0.4"/>
</svg>
